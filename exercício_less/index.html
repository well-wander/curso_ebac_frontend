<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página do Well</title>

    <link rel="stylesheet" href="build/styles/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

            <div class="profile-bio">
                <h1 class="profile-bio-name">Well Wander</h1>

                <h2 class="profile-bio-subtitle">
                    Designer & Desenvolvedor Front-end

                <p class="profile-bio-description">
                    Designer de produtos digitais apaixonado por tecnologia,

        <nav>
            <ul class="social-links">
                <li>
                    <a
                        href="https://www.instagram.com/o_o_well/"
                        target="_blank"
                        rel="noopener noreferrer"

                            src="./src/images/instagram.svg"
                            alt="Logo do Instagram"
                        />
                    </a>
                </li>

                <li>
                    <a
                        href="https://www.linkedin.com/in/wellington-lima-69660a328"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                            src="./src/images/linkedin.svg"
                            alt="Logo do LinkedIn"
                        />
                    </a>
                </li>

                <li>
                    <a
                        href="https://github.com/well-wander"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <img
                            src="./src/images/github.svg"
                            alt="Logo do GitHub"
                        />
                    </a>
                </li>

                <li>
                    <a href="mailto:wellwander@gmail.com">
                        <img
                            src="./src/images/mail.svg"
                            alt="Enviar e-mail"
                        />
                    </a>
                </li>
            </ul>
        </nav>

        <nav>
            <ul class="projects-list">

                <li class="projects-list-item">
                    <a
                        href="https://github.com/well-wander/curso_ebac_frontend/tree/exercicio_bootstrap/exercicio_bootstrap"

                    <a
