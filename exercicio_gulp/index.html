<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio Gulp</title>
    <link rel="stylesheet" href="dist/css/style.css">
</head>
<body>

    <main>
        <header>
            <p class="tag">EBAC - FRONT-END</p>

            </p>

        <section class="gallery">

            <img src="dist/images/butterfly-g7f3546b64_1920.jpg" alt="Borboleta">
            <img src="dist/images/hands-gc143a78ba_1920.png" alt="Maos">
            <img src="dist/images/lilies-g19bcb21a4_1920.jpg" alt="Lirios">

        <section class="features">
            <article>
                <strong>Sass</strong>
                <span>Compilado</span>
            </article>

            <article>
                <strong>Imagens</strong>
                <span>Otimizadas</span>
            </article>

            <article>
                <strong>JavaScript</strong>
                <span>Minificado</span>
            </article>

    <script src="dist/js/script.js"></script>
